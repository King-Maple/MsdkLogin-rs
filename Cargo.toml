[package]
name = "msdk-login-rs"
version = "0.1.0"
edition = "2021"
description = "Shared QQ/WeChat QR login and MSDK token exchange"
repository = "https://github.com/King-Maple/MsdkLogin-rs"
publish = false

[lib]
name = "msdk_login"

[dependencies]
serde = { version = "1", features = ["derive"] }
zeroize = "1"
base64 = "0.22"
md-5 = "0.10"
regex = "1"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
axum = "0.8"
